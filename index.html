<!DOCTYPE html><html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GlowandGrow — Template Penjualan</title>
  <meta name="description" content="Website penjualan GlowandGrow dengan keranjang, filter, dan checkout via WhatsApp." />
  <script src="https://cdn.tailwindcss.com"></script>
    <script>
    // Router sederhana (SPA) agar klik opsi membuka halaman berikutnya (URL berubah) tanpa menampilkan di bawah
    (function(){
      const routes = { '/': 'home', '/ebook': 'ebook', '/game': 'game', '/kelas': 'kelas' };
      const ids = Object.values(routes);
      function show(id){ ids.forEach(x=>{ const el = document.getElementById(x); if(!el) return; if(x===id) el.classList.remove('hidden'); else el.classList.add('hidden'); }); }
      function render(){
        let path = location.pathname;
        if (path.length>1 && path.endsWith('/')) path = path.slice(0,-1);
        const id = routes[path] || 'home';
        show(id);
        window.scrollTo(0,0);
      }
      // Intercept link clicks to internal routes only
      document.addEventListener('click', (e)=>{
        const a = e.target.closest('a[href^="/"]');
        if (!a) return;
        const url = a.getAttribute('href');
        if (!routes[url]) return; // allow non-routed links
        e.preventDefault();
        history.pushState({}, '', url);
        render();
      });
      // Back/forward support
      window.addEventListener('popstate', render);
      // Back buttons
      document.addEventListener('click', (e)=>{
        const btn = e.target.closest('[data-back]');
        if (!btn) return;
        e.preventDefault();
        history.back();
      });
      // Initial render
      render();
    })();
  </script>
</body>
</html>
